<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>הדרכה בנשיא</title>
<link rel="icon" type="image/png" href="img/logo-64.png">
<link rel="apple-touch-icon" href="img/icon-512.png">
<meta name="theme-color" content="#0B0B0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Karantina:wght@400;700&display=swap">
<style>
/* ================================================================
   הדרכה בנשיא — visual language taken from the tribe emblem:
   comic-print black outlines, the red field, the black sunburst.
   ================================================================ */
:root{
  --ink:#0B0B0B; --ink-2:#45443F; --ink-3:#86847D;
  --paper:#F5F3EE; --surface:#FFFFFF; --surface-2:#EEECE6; --surface-3:#E2DFD7;
  --line:#E0DDD5; --line-2:#C9C5BB; --edge:#0B0B0B;
  --red:#E2231A; --red-ink:#B0150E; --red-soft:#FCE6E3; --on-red:#FFFFFF;
  --chrome:#0B0B0B; --chrome-2:#1E1E1C; --on-chrome:#FFFFFF; --on-chrome-2:#A3A19A;
  --green:#1C7446; --green-soft:#E1F1E7; --amber:#9A600C; --amber-soft:#FBEFD9;
  /* legacy aliases used by older markup */
  --bg:var(--paper); --khaki:var(--ink-2); --khaki-soft:var(--surface-2); --khaki-ink:var(--ink); --blue:var(--ink); --blue-soft:var(--surface-2);
  --hard:3px 3px 0 var(--edge); --hard-sm:2px 2px 0 var(--edge);
  --shadow-lg:0 18px 44px rgba(0,0,0,.22);
  --r:10px; --r-sm:6px;
  --f-ui:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --f-display:"Karantina","IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --nav-h:64px;
  --burst:repeating-conic-gradient(from 0deg at var(--bx,82%) var(--by,46%),rgba(0,0,0,var(--ba,.16)) 0deg 7deg,transparent 7deg 18deg);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2F0EA; --ink-2:#BCB9B0; --ink-3:#7F7D76;
    --paper:#0D0D0C; --surface:#171715; --surface-2:#201F1D; --surface-3:#2A2926;
    --line:#2A2926; --line-2:#3A3935; --edge:#000000;
    --red:#EA3328; --red-ink:#FF7468; --red-soft:#2C1311;
    --chrome:#000000; --chrome-2:#1A1A18;
    --green:#53B985; --green-soft:#132A1D; --amber:#E3A54C; --amber-soft:#2D2312;
    --hard:3px 3px 0 #000; --hard-sm:2px 2px 0 #000; --shadow-lg:0 18px 44px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F2F0EA; --ink-2:#BCB9B0; --ink-3:#7F7D76;
  --paper:#0D0D0C; --surface:#171715; --surface-2:#201F1D; --surface-3:#2A2926;
  --line:#2A2926; --line-2:#3A3935; --edge:#000000;
  --red:#EA3328; --red-ink:#FF7468; --red-soft:#2C1311;
  --chrome:#000000; --chrome-2:#1A1A18;
  --green:#53B985; --green-soft:#132A1D; --amber:#E3A54C; --amber-soft:#2D2312;
  --hard:3px 3px 0 #000; --hard-sm:2px 2px 0 #000; --shadow-lg:0 18px 44px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-ui);direction:rtl;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--red-ink);text-underline-offset:3px}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svg.sm{width:16px;height:16px}.svg.lg{width:24px;height:24px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:.95}

/* ---------------- shell ---------------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);color:var(--on-chrome);box-shadow:0 3px 0 var(--red)}
.topbar.flat{box-shadow:none}
.topbar-in{display:flex;align-items:center;gap:2px;min-height:58px;padding-inline:8px;max-width:1180px;margin-inline:auto}
.tb-title{flex:1;min-width:0;font:600 16px/1.25 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:6px}
.tb-title small{display:block;font:500 12px/1.3 var(--f-ui);color:var(--on-chrome-2)}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;color:inherit;flex:none;position:relative}
.iconbtn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.iconbtn:active{transform:scale(.94)}
.iconbtn .badge{position:absolute;top:5px;inset-inline-end:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--f-ui);text-align:center;box-shadow:0 0 0 2px var(--chrome)}
.topbar .savestate{color:var(--on-chrome-2)}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px;flex:1;min-width:0}
.brand-logo{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--chrome),0 0 0 3.5px var(--red)}
.brand-name{font:700 27px/1 var(--f-display);color:var(--on-chrome);letter-spacing:.01em;padding-top:3px}
.brand-name span{color:var(--red)}
main{flex:1;width:100%;max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
.bottomnav{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--chrome);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .2s}
.bottomnav-in{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);max-width:520px;margin-inline:auto}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on-chrome-2);font:500 11.5px/1 var(--f-ui);position:relative;min-height:48px}
.navbtn[aria-current="page"]{color:var(--on-chrome)}
.navbtn[aria-current="page"]::after{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.navbtn.create .plus{width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 0 0 4px var(--chrome)}
.navbtn.create span{display:none}
body.kb .bottomnav{transform:translateY(110%)}
.rail{display:none}
@media (min-width:1000px){
  .bottomnav{display:none}
  #app{flex-direction:row}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;width:248px;flex:none;padding:18px 14px;background:var(--chrome);color:var(--on-chrome);box-shadow:inset -3px 0 0 var(--red)}
  .rail .brand{padding:4px 6px 24px;flex:none}
  .railbtn{display:flex;align-items:center;gap:12px;height:46px;padding-inline:12px;border-radius:8px;color:var(--on-chrome-2);font-weight:500;position:relative}
  .railbtn:hover{color:var(--on-chrome);background:var(--chrome-2)}
  .railbtn[aria-current="page"]{color:var(--on-chrome);background:var(--chrome-2)}
  .railbtn[aria-current="page"] .svg{color:var(--red)}
  .railbtn.create{background:var(--red);color:#fff;margin-bottom:16px;justify-content:center;font-weight:600;box-shadow:0 3px 0 #7c0e09}
  .railbtn.create:hover{background:var(--red-ink)}
  .railbtn.create:active{transform:translateY(2px);box-shadow:0 1px 0 #7c0e09}
  .rail-foot{margin-top:auto;font-size:12px;color:var(--on-chrome-2);padding:10px 8px;border-top:1px solid var(--chrome-2)}
  .rail-foot .savestate{color:var(--on-chrome-2);padding:0}
  .shell-col{flex:1;min-width:0;display:flex;flex-direction:column}
  main{padding-block:0 56px;padding-inline:28px}
  .topbar .brand{display:none}
}

/* ---------------- building blocks ---------------- */
.section{margin-block:30px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h2{font:700 31px/.9 var(--f-display);letter-spacing:.01em}
.sec-head .link,.hint a,.notice a,.goalbox a{position:relative}.sec-head .link::before,.hint a::before,.notice a::before{content:"";position:absolute;inset:-12px -8px}.sec-head .link{font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;min-height:40px;border-bottom:2px solid var(--red);line-height:1.2;min-height:0;padding-bottom:2px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.eyebrow{font:600 12px/1.2 var(--f-ui);color:var(--ink-3)}
.card{background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:8px;font-weight:600;font-size:15px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);white-space:nowrap;box-shadow:var(--hard-sm);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-width:1.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tag{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.red,.tag.khaki{background:var(--red);color:#fff}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty .svg{width:34px;height:34px;color:var(--ink-3);margin-bottom:8px}
.empty h3{font:700 30px/1 var(--f-display);color:var(--ink);margin-bottom:8px}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- forms ---------------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.textarea,.select{width:100%;min-height:48px;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;line-height:1.5}
.textarea{min-height:92px;resize:vertical;field-sizing:content}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--edge);box-shadow:var(--hard-sm)}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.input.title-input{font:700 42px/.95 var(--f-display);letter-spacing:.01em;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 0 4px;min-height:54px;box-shadow:none;resize:none;overflow:hidden;field-sizing:content;display:block}
.input.title-input:focus{border-bottom-color:var(--red);box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.hint{font-size:12.5px;color:var(--ink-3)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);height:42px}
.stepper button{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.stepper input{width:44px;height:40px;text-align:center;border:0;background:transparent;font-size:16px;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.check{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding-block:9px;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--edge);flex:none;margin-top:1px;display:grid;place-items:center;background:var(--surface)}
.check input:checked{background:var(--red);border-color:var(--red)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check.done span{color:var(--ink-3);text-decoration:line-through}

/* ---------------- home ---------------- */
.hero{position:relative;margin-inline:-16px;padding:22px 18px 24px;background:var(--burst),var(--red);color:#fff;overflow:hidden;border-bottom:3px solid var(--edge)}
.hero-in{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero .kicker{display:inline-block;font:600 12.5px/1 var(--f-ui);background:var(--ink);color:#fff;padding:6px 9px;border-radius:5px}
.hero h1{font:700 68px/.84 var(--f-display);letter-spacing:.01em;margin:12px 0 6px;color:#fff;text-shadow:3px 3px 0 var(--edge)}
.hero p{margin:0;font-size:14.5px;font-weight:500;max-width:34ch;color:#fff}
.hero-logo{width:118px;height:118px;border-radius:50%;box-shadow:0 0 0 3px var(--edge),6px 6px 0 var(--edge);background:#fff}
.searchbox{display:flex;align-items:center;gap:10px;height:52px;padding-inline:14px;border-radius:10px;background:var(--surface);border:2px solid var(--edge);cursor:text;box-shadow:var(--hard)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%;color:var(--ink)}
.searchbox input:focus{outline:none}
.searchbox .svg{color:var(--ink)}
.hero .searchbox{margin-top:18px;position:relative}
.statgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 4px 9px;background:var(--surface);border:2px solid var(--edge);border-radius:10px;color:var(--ink);box-shadow:var(--hard-sm);text-align:center}
.stat b{font:700 34px/.9 var(--f-display);color:var(--ink)}
.stat span{font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stat:active{transform:translate(2px,2px);box-shadow:none}
@media (max-width:520px){.statgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.stat b{font-size:29px}.stat span{font-size:10.5px}}
.newrow{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-top:20px}
.newrow .btn{padding:0 10px;font-size:14.5px}
@media (min-width:1000px){
  .hero{margin-inline:0;margin-top:24px;border-radius:16px;border:3px solid var(--edge);padding:34px 36px 30px;box-shadow:6px 6px 0 var(--edge);--bx:88%;--by:50%}
  .hero h1{font-size:104px}
  .hero p{font-size:16px}
  .hero-logo{width:200px;height:200px}
  .hero .searchbox{max-width:620px}
  .statgrid{max-width:720px}
  .newrow{max-width:600px}
}
.index{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:760px){.index{grid-template-columns:repeat(4,1fr)}}
.index button{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:10px 14px;text-align:start;font-size:14px;font-weight:600;background:var(--surface);border:1.5px solid var(--line-2);border-radius:10px}
.index button:hover{border-color:var(--edge);box-shadow:var(--hard-sm)}
.index button .num{font:700 13px/1 var(--f-ui);color:#fff;background:var(--red);border-radius:5px;padding:4px 7px}

/* ---------------- lists ---------------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 10px;background:transparent;border:0;border-top:1px solid var(--line);text-align:start;width:100%;position:relative;cursor:pointer}
.list>.row:first-child,.list>.card:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row:active{background:var(--surface-3)}
.row .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink)}
.row .bd{flex:1;min-width:0}
.row h3{font-size:15.5px;font-weight:600;line-height:1.38;margin-bottom:3px}
.row .meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;color:var(--ink-3);align-items:center}
.row .meta span:first-child{color:var(--red-ink);font-weight:600}
.row .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.row .snip{font-size:13.5px;color:var(--ink-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .snip mark,.hl mark{background:#FFE36B;color:#000;border-radius:2px;padding:0 1px}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.row .fav{color:var(--line-2);width:40px!important;height:40px!important}
.row .fav.on{color:var(--red)}
.list>.card{border:0;border-top:1px solid var(--line);border-radius:0}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.cards.c3{grid-template-columns:1fr 1fr 1fr}}
.wcard{display:flex;flex-direction:column;gap:8px;padding:15px 16px;background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--r);text-align:start;width:100%;box-shadow:var(--hard-sm)}
.wcard:hover{background:var(--surface-2)}
.wcard:active{transform:translate(2px,2px);box-shadow:none}
.wcard h3{font-size:16px;font-weight:600;line-height:1.35}
.wcard .top{display:flex;align-items:center;gap:8px}
.wcard .foot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.progress{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:1}
.progress i{display:block;height:100%;border-radius:3px;background:var(--green)}
.progress.warn i{background:var(--red)}
.more{display:flex;justify-content:center;padding:16px}

/* ---------------- library ---------------- */
.lib-head{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:20;background:var(--paper);padding-block:14px 0;margin-inline:-16px;padding-inline:16px;border-bottom:1.5px solid var(--edge)}
.seg{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;font-size:14.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;border-bottom:3px solid transparent}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--red)}
.seg .n{font-size:11.5px;color:var(--ink-3);font-weight:600;background:var(--surface-2);border-radius:4px;padding:1px 5px}
.seg button[aria-pressed="true"] .n{background:var(--ink);color:var(--paper)}
.filters{display:flex;gap:6px;padding-block:10px 12px;overflow-x:auto;scrollbar-width:none;align-items:center;margin-inline:-16px;padding-inline:16px}
.filters::-webkit-scrollbar{display:none}
.resinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-block:14px 8px}
.lib-layout{display:block}
@media (min-width:1000px){.lib-head,.seg,.filters{margin-inline:-28px;padding-inline:28px}}
@media (min-width:1100px){
  .lib-layout.split{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:22px;align-items:start}
